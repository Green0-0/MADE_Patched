hydra:
  run:
    dir: ${hydra:runtime.cwd}/results/${now:%Y%m%d-%H%M%S}-${hydra:runtime.choices.oracle}-${hydra:runtime.choices.agent}
  sweep:
    dir: ${hydra.run.dir}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - agent=chemeleon_generative_baseline
    - experiment.systems_file=./data/systems_10_mp_20/systems_quinary_n10_maxatoms20_intermetallic_smact.json
    - experiment.max_systems=10
    - environment.budget=50
    - experiment.num_episodes=5
    - experiment.infra=local
    - experiment.output_dir=results/baselines/20260515-221555/chemeleon_generative_baseline_systems_quinary_n10_maxatoms20_intermetallic_smact_10systems_idx9_50queries_100stabilitymeV
    - logger.use_wandb=True
    - logger.wandb_project=made-baselines
    - environment.stability_tolerance=0.1
    - ++agent.max_stoichiometry=20
    - ++agent.planner.max_stoichiometry=20
    - environment.max_stoichiometry=20
    - ++logger.wandb_group=chemeleon_generative_baseline_systems_quinary_n10_maxatoms20_intermetallic_smact_10systems_50queries_100stabilitymeV
    - +experiment.system_index=9
  job:
    name: run_multi_systems
    chdir: null
    override_dirname: ++agent.max_stoichiometry=20,++agent.planner.max_stoichiometry=20,++logger.wandb_group=chemeleon_generative_baseline_systems_quinary_n10_maxatoms20_intermetallic_smact_10systems_50queries_100stabilitymeV,+experiment.system_index=9,agent=chemeleon_generative_baseline,environment.budget=50,environment.max_stoichiometry=20,environment.stability_tolerance=0.1,experiment.infra=local,experiment.max_systems=10,experiment.num_episodes=5,experiment.output_dir=results/baselines/20260515-221555/chemeleon_generative_baseline_systems_quinary_n10_maxatoms20_intermetallic_smact_10systems_idx9_50queries_100stabilitymeV,experiment.systems_file=./data/systems_10_mp_20/systems_quinary_n10_maxatoms20_intermetallic_smact.json,logger.use_wandb=True,logger.wandb_project=made-baselines
    id: ???
    num: ???
    config_name: config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.2
    version_base: '1.3'
    cwd: /home/users/kg349/MADE_Patched
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/users/kg349/MADE_Patched/configs
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/users/kg349/MADE_Patched/results/20260515-221559-orb-chemeleon_generative_baseline
    choices:
      oracle: orb
      logger: wandb
      environment: convex_hull
      dataset: phase_diagram
      agent: chemeleon_generative_baseline
      agent/scorer: random
      agent/filter: noop
      agent/generator: cached
      agent/planner: random
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
