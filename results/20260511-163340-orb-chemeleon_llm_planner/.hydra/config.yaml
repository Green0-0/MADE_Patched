agent:
  planner:
    _target_: made.agents.planners.llm.LLMPlanner
    max_stoichiometry: 20
    num_compositions: 1
    num_candidates: 32
    max_context_entries: 20
    llm_config:
      model: openai/QuantTrio/Qwen3.5-9B-AWQ
      max_tokens: 16384
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      cache: false
    context_config:
      objective_prompt: "You are a planner for a material discovery experiment. Your\
        \ goal is to discover as many NOVEL, UNIQUE, STABLE (or metastable) structures\
        \ as possible.\n\nCRITICAL CONSTRAINT: You MUST ONLY use elements from the\
        \ provided 'elements' list in your compositions. And you MUST ONLY propose\
        \ compositions that are within the max_stoichiometry.\n- Example: If elements=['Li',\
        \ 'O'], you can propose Li2O, LiO2, etc., but NOT Na2O, Fe2O3, etc.\n- Example:\
        \ If max_stoichiometry=20, you can propose Li2O, LiO2, etc., but NOT Li19O19.\n\
        \nDEFINITIONS:\n- STABLE/METASTABLE: Structures with e_above_hull <= stability_tolerance.\n\
        - NOVEL: Not already known on the convex hull (is_newly_discovered=True).\n\
        - UNIQUE: Structurally distinct from previously evaluated structures.\n- Entries\
        \ marked is_stable_or_metastable=True with is_newly_discovered=True are successful\
        \ discoveries.\n\nPHASE DIAGRAM CONCEPTS:\n- Reduced formulas (e.g., Li2O)\
        \ represent UNIQUE POINTS on the phase diagram.\n- Different reduced compositions\
        \ = different phase diagram points → PRIORITIZE DIVERSE reduced compositions\
        \ for broad coverage.\n\nSTRUCTURE DIVERSITY AT SAME COMPOSITION:\n- Multiple\
        \ DIFFERENT structures can exist at the SAME reduced composition (same phase\
        \ diagram point)\n- Different structures for the SAME composition can have\
        \ DIFFERENT stabilities (one unstable doesn't mean all are!)\n- Different\
        \ unit cell sizes (Li2O vs Li4O2) create different structures but occupy the\
        \ SAME phase diagram point\n\nSTRATEGY:\n- Explore diverse reduced compositions\
        \ (different phase diagram points) to maximize phase diagram coverage.\n-\
        \ If a reduced composition has yielded stable/metastable NOVEL structures,\
        \ consider proposing MORE unit cell sizes for it as additional stable polymorphs\
        \ may exist.\n- Compositions with only [unstable] entries may still have stable\
        \ structures. \n- Balance exploration (new reduced compositions) vs exploitation\
        \ (trying to find stable structures for compositions with only [unstable]\
        \ entries)\n\nPropose FULL formulas with specific unit cell sizes (e.g., Li2O,\
        \ Li4O2, LiO2) not just reduced formulas.\n"
      include_structure_info: true
      include_composition_counter: true
      include_recent_trial: true
      previous_observations: 1
  generator:
    _target_: made.agents.generators.CachedGenerator
    num_initial_candidates: 32
    cache_by_composition: true
    base_generator:
      _target_: made.agents.generators.ChemeleonGenerator
      task: csp
      batch_size: 256
      device: cuda
      output_dir: null
  filter:
    _target_: made.agents.filters.NoOpFilter
  scorer:
    _target_: made.agents.scorers.RandomSelector
    seed: null
  _target_: made.agents.OneShotWorkflowAgent
  max_stoichiometry: 20
dataset:
  _target_: made.data.PhaseDiagramDataset
  elements:
  - Li
  - O
  thermo_types:
  - GGA_GGA+U
environment:
  _target_: made.envs.ConvexHullEnvironment
  budget: 50
  start_with_all_stable: true
  compute_elemental_from_oracle: true
  stability_tolerance: 0.1
  include_near_stable_from_ground_truth: true
  filter_by_smact: true
  max_stoichiometry: 20
  structure_matcher_ltol: 0.2
  structure_matcher_stol: 0.3
  structure_matcher_angle_tol: 5
  structure_matcher_primitive_cell: true
logger:
  use_wandb: true
  wandb_project: made-baselines
  wandb_entity: num110010
  wandb_run_name: null
  wandb_tags:
  - benchmark
  wandb_group: chemeleon_llm_planner_systems_quaternary_n10_maxatoms20_intermetallic_smact_10systems_50queries_100stabilitymeV
oracle:
  _target_: made.oracles.ORBOracle
  model_name: orb-v3-conservative-inf-omat
  device: auto
  element_reference_energies_path: ./data/2023-02-07-mp-elemental-reference-entries.json
  relax: true
  relax_kwargs:
    optimizer: fire
    fmax: 0.02
    steps: 500
    relax_unit_cell: true
  num_workers: 1
experiment:
  output_dir: results/baselines/20260511-163332/chemeleon_llm_planner_systems_quaternary_n10_maxatoms20_intermetallic_smact_10systems_idx0_50queries_100stabilitymeV
  num_episodes: 5
  seed: null
  infra: local
  verbose: true
  logging_level: INFO
  systems: []
  systems_file: ./data/systems_10_mp_20/systems_quaternary_n10_maxatoms20_intermetallic_smact.json
  max_systems: 10
  system_index: 0
